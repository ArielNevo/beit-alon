<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בית אלון">
<meta name="robots" content="noindex, nofollow">
<title>בית אלון · ניהול שיפוץ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B4583A'/><path d='M22 50 50 26l28 24v26a4 4 0 0 1-4 4H58V60H42v20H26a4 4 0 0 1-4-4z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface-2:#FBF9F6; --sunk:#EFEAE2;
  --ink:#24221F; --ink-2:#5E5A54; --ink-3:#8F8981; --line:#E6E0D7; --line-2:#D8D0C4;
  --accent:#B4583A; --accent-2:#9A4529; --accent-soft:#F5E6DE; --accent-ink:#fff;
  --olive:#5F6B3C; --olive-soft:#E9ECDD;
  --todo:#8F8981; --todo-bg:#EFEBE5;
  --prog:#2F6FB0; --prog-bg:#E2ECF7;
  --wait:#B07A12; --wait-bg:#F8EDD3;
  --stuck:#8A4FA0; --stuck-bg:#F0E5F4;
  --late:#C2352B; --late-bg:#FBE3E0;
  --done:#3E8B57; --done-bg:#E1F1E6;
  --cancel:#ADA79E; --cancel-bg:#F1EEEA;
  --p-ariel:#2F6FB0; --p-rinat:#B4583A; --p-arch:#5F6B3C; --p-other:#8F8981;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 4px 16px rgba(40,30,20,.06);
  --shadow-lg:0 10px 40px rgba(40,30,20,.18);
  --r:14px; --r-sm:10px;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --serif:'Frank Ruhl Libre','Heebo',Georgia,serif;
  --nav-w:232px; --top-h:60px; --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171614; --surface:#211F1C; --surface-2:#1C1A18; --sunk:#141311;
    --ink:#F1ECE4; --ink-2:#BDB5AA; --ink-3:#8A8379; --line:#34302B; --line-2:#433E37;
    --accent:#E07F5E; --accent-2:#EC9677; --accent-soft:#3A251D; --accent-ink:#1A0F0A;
    --olive:#A9B77A; --olive-soft:#2A2E1E;
    --todo:#A39C92; --todo-bg:#2B2825;
    --prog:#6FA5E0; --prog-bg:#1D2A38;
    --wait:#E0B04D; --wait-bg:#352A15;
    --stuck:#C08DD4; --stuck-bg:#2F2236;
    --late:#F07467; --late-bg:#3C1F1C;
    --done:#6CC48A; --done-bg:#1C3125;
    --cancel:#7A746C; --cancel-bg:#262422;
    --p-ariel:#6FA5E0; --p-rinat:#E07F5E; --p-arch:#A9B77A; --p-other:#8A8379;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:30;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.brand .logo svg{width:20px;height:20px;fill:#fff;stroke:none}
.brand b{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3);display:block;margin-top:-4px;white-space:nowrap}
.top-sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--done);display:block}
.sync.local i{background:var(--wait)} .sync.off i{background:var(--late)} .sync.saving i{background:var(--prog);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.me-btn{border:0;background:none;padding:0;display:flex;align-items:center;gap:8px}
.layout{display:flex;min-height:calc(100vh - var(--top-h))}
.sidenav{display:none}
main{flex:1;min-width:0;padding:20px 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom));max-width:1240px;margin-inline:auto;width:100%}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-size:11.5px;font-weight:500;position:relative}
.tabbar a.on{color:var(--accent)}
.tabbar a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar svg.i{width:23px;height:23px}
@media (min-width:900px){
  .tabbar{display:none}
  .sidenav{display:flex;flex-direction:column;gap:2px;width:var(--nav-w);flex:none;padding:18px 12px;border-inline-end:1px solid var(--line);position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));overflow:auto}
  .sidenav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500}
  .sidenav a:hover{background:var(--sunk);color:var(--ink)}
  .sidenav a.on{background:var(--accent-soft);color:var(--accent-2)}
  .sidenav a .cnt{margin-inline-start:auto;font-size:12px;background:var(--late);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
  .sidenav .sep{height:1px;background:var(--line);margin:10px 8px}
  .sidenav .foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:8px 12px}
  main{padding:28px 32px 48px}
}
@media (prefers-color-scheme: dark){ .sidenav a.on{color:var(--accent-2)} }

/* ---------- common ---------- */
h1,h2,h3{margin:0;font-weight:700;line-height:1.25}
h1{font-family:var(--serif);font-size:28px}
h2{font-size:17px}
h3{font-size:15px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{flex:1;min-width:200px}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:14px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2{flex:1}
.card-h a,.linkbtn{font-size:13px;color:var(--accent);text-decoration:none;background:none;border:0;padding:0;font-weight:500}
.grid{display:grid;gap:16px}
@media (min-width:900px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g-main{grid-template-columns:1.35fr 1fr} }
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.fab{position:fixed;inset-inline-start:auto;inset-inline-end:18px;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));z-index:25;height:54px;padding:0 20px 0 22px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg)}
.fab svg.i{width:22px;height:22px}
@media (min-width:900px){ .fab{bottom:28px;inset-inline-end:32px} }
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;white-space:nowrap;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-size:11.5px;opacity:.75}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){ .chips{flex-wrap:wrap;margin-inline:0;padding-inline:0} }
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.inp,select.inp,textarea.inp{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:16px}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=date].inp{direction:rtl;text-align:right}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.search{position:relative;flex:1;min-width:180px}
.search .inp{padding-inline-start:38px;height:42px}
.search svg{position:absolute;inset-inline-start:12px;top:11px;color:var(--ink-3)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select.inp{width:auto;min-height:38px;height:38px;padding:0 10px;font-size:14px}
.empty{text-align:center;padding:36px 16px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--wait-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--wait) 30%,transparent);margin-bottom:16px;font-size:14px}
.banner b{display:block}
.banner .btn{margin-inline-start:auto}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:0;background:var(--todo-bg);color:var(--todo)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-todo{--sc:var(--todo);--sb:var(--todo-bg)} .s-prog{--sc:var(--prog);--sb:var(--prog-bg)} .s-wait{--sc:var(--wait);--sb:var(--wait-bg)} .s-stuck{--sc:var(--stuck);--sb:var(--stuck-bg)} .s-late{--sc:var(--late);--sb:var(--late-bg)} .s-done{--sc:var(--done);--sb:var(--done-bg)} .s-cancel{--sc:var(--cancel);--sb:var(--cancel-bg)}
.pill[class*=" s-"],.pill[class^="s-"]{background:var(--sb);color:var(--sc)}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.96)}
.prio{display:inline-block;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);flex:none}
.prio.p1{background:var(--late)} .prio.p2{background:var(--wait)} .prio.p3{background:var(--line-2)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--p-other);flex:none;border:2px solid var(--surface)}
.av.lg{width:34px;height:34px;font-size:14px}
.avs{display:inline-flex}
.avs .av+.av{margin-inline-start:-8px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}

/* ---------- home ---------- */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:18px}
.hero .t{flex:1;min-width:240px}
.eyebrow{font-size:13px;color:var(--ink-3);font-weight:500}
.hero h1{font-size:30px;margin:2px 0 6px}
.hero p{margin:0;color:var(--ink-2)}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scen .lbl{font-size:12px;color:var(--ink-3);line-height:1.3}
.scen .lbl b{display:block;color:var(--ink);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(5,1fr)} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-size:32px;font-weight:700;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.key .k,.kpi.key .s{color:color-mix(in srgb,var(--accent-ink) 80%,transparent)}
.kpi.alert .v{color:var(--late)}
.kpi .ring{position:absolute;inset-inline-end:12px;bottom:12px;width:44px;height:44px}
.list{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;min-height:56px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.trow .tm{flex:1;min-width:0}
.trow .tt{font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.trow.done .tt{text-decoration:line-through;color:var(--ink-3)}
.trow .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin-top:2px;flex-wrap:wrap}
.trow .due{font-size:12.5px;text-align:end;white-space:nowrap;color:var(--ink-2);flex:none}
.trow .due.late{color:var(--late);font-weight:600}
.trow .due.soon{color:var(--wait);font-weight:600}
.sbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--sc,var(--todo));background:transparent;display:grid;place-items:center;flex:none;color:var(--sc);padding:0}
.sbtn.s-done{background:var(--done);border-color:var(--done);color:#fff}
.sbtn.s-prog{background:conic-gradient(var(--prog) 0 50%,transparent 0)}
.sbtn.s-cancel{border-style:dashed}
.sbtn svg{width:16px;height:16px;stroke-width:2.6}
.sbtn:hover{transform:scale(1.08)}
.phase-row{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;font-size:13.5px;text-decoration:none;color:inherit}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--olive)}
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:6px 0 10px}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--sc)}
.ms{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ms:last-child{border-bottom:0}
.ms .d{width:48px;text-align:center;flex:none;background:var(--sunk);border-radius:10px;padding:4px 0;line-height:1.15}
.ms .d b{display:block;font-size:18px}
.ms .d span{font-size:11px;color:var(--ink-2)}
.ms.key .d{background:var(--accent);color:var(--accent-ink)} .ms.key .d span{color:inherit}
.ms .n{flex:1;min-width:0;font-weight:500}
.dec{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dec:last-child{border-bottom:0}
.dec .no{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dec .tx{flex:1;min-width:0;font-weight:500;font-size:14px}

/* ---------- tasks ---------- */
.group{margin-bottom:18px}
.group-h{display:flex;align-items:center;gap:10px;padding:6px 4px 8px;position:sticky;top:var(--top-h);background:var(--bg);z-index:2}
.group-h h3{font-size:14.5px}
.group-h .bar{flex:1;max-width:160px;height:6px}
.group-h .c{font-size:12.5px;color:var(--ink-3)}
.group .card{padding:4px 12px}

/* ---------- board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;align-items:flex-start}
.col{flex:0 0 min(84vw,300px);background:var(--sunk);border-radius:var(--r);padding:10px;scroll-snap-align:start;max-height:calc(100vh - 220px);display:flex;flex-direction:column}
@media (min-width:900px){ .board{margin-inline:0;padding-inline:0} .col{flex-basis:270px;max-height:calc(100vh - 190px)} }
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:600;font-size:14px}
.col-h .n{margin-inline-start:auto;font-size:12.5px;color:var(--ink-3);font-weight:500}
.col-b{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px;border-radius:10px;padding:2px}
.col.over .col-b{background:color-mix(in srgb,var(--accent) 10%,transparent);outline:2px dashed var(--accent)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:grab;border-inline-start:3px solid var(--sc,var(--line))}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .tt{font-weight:500;font-size:14px;margin-bottom:6px}
.kcard .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.kcard .meta .sp{flex:1}

/* ---------- gantt ---------- */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 230px);position:relative}
.gantt{position:relative;--lw:230px}
@media (max-width:700px){ .gantt{--lw:132px} }
.g-head{position:sticky;top:0;z-index:5;background:var(--surface);display:flex;border-bottom:1px solid var(--line)}
.g-corner{position:sticky;inset-inline-start:0;z-index:6;width:var(--lw);flex:none;background:var(--surface);border-inline-end:1px solid var(--line);padding:8px 10px;font-size:12px;color:var(--ink-3);display:flex;align-items:flex-end}
.g-scale{position:relative;height:52px;flex:none}
.g-month{position:absolute;top:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding-inline-start:6px;border-inline-start:1px solid var(--line-2);height:46px;white-space:nowrap}
.g-week{position:absolute;bottom:4px;font-size:10.5px;color:var(--ink-3);transform:translateX(50%)}
.g-row{display:flex;min-height:34px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.g-row:hover .g-label{background:var(--surface-2)}
.g-label{position:sticky;inset-inline-start:0;z-index:3;width:var(--lw);flex:none;background:var(--surface);border-inline-end:1px solid var(--line);padding:6px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer;line-height:1.3}
.g-label .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.g-label .id{font-size:10.5px;color:var(--ink-3)}
.g-track{position:relative;flex:none}
.g-track.wk{background-image:repeating-linear-gradient(to left,transparent 0,transparent calc(var(--wpx) - 1px),color-mix(in srgb,var(--line) 55%,transparent) calc(var(--wpx) - 1px),color-mix(in srgb,var(--line) 55%,transparent) var(--wpx))}
.g-bar{position:absolute;top:8px;height:18px;border-radius:6px;background:var(--sb);border:1px solid var(--sc);cursor:pointer;overflow:hidden;min-width:6px}
.g-bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--sc);opacity:.85}
.g-bar:hover{filter:brightness(.95);box-shadow:0 0 0 2px var(--sb)}
.g-ph{display:flex;background:var(--surface-2);border-bottom:1px solid var(--line)}
.g-ph .g-label{background:var(--surface-2);font-weight:700;font-size:12.5px;cursor:default}
.g-line{position:absolute;top:0;bottom:0;width:2px;z-index:4;pointer-events:none}
.g-line.today{background:var(--prog)}
.g-line.key{background:var(--accent);width:2px;opacity:.75}
.g-line span{position:absolute;top:2px;transform:translateX(50%);font-size:10.5px;font-weight:700;color:#fff;padding:1px 6px;border-radius:5px;white-space:nowrap}
.g-line.today span{background:var(--prog)} .g-line.key span{background:var(--accent);top:20px}
.g-dia{position:absolute;top:9px;width:14px;height:14px;transform:translateX(50%) rotate(45deg);background:var(--ink);border-radius:2px;cursor:pointer}
.g-dia.key{background:var(--accent)}
.g-dia.past{background:var(--ink-3)}

/* ---------- shop ---------- */
.budget{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.budget .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.bbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex;flex:1;min-width:160px}
.bbar i{height:100%;display:block}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media (max-width:520px){ .items{grid-template-columns:1fr 1fr;gap:10px} }
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer}
.item .ph{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;font-size:40px;position:relative;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.item .ph .pill{position:absolute;top:8px;inset-inline-start:8px}
.item .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.item .rm{font-size:12px;color:var(--ink-3)}
.item .pr{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.item .ap{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.vote{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px 2px 4px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.vote.yes{background:var(--done-bg);color:var(--done)} .vote.no{background:var(--late-bg);color:var(--late)}
.vote .av{width:20px;height:20px;font-size:10px;border:0}
.vbtns{display:flex;gap:6px;margin-inline-start:auto}
.vbtns button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;padding:0}
.vbtns button.on.y{background:var(--done);border-color:var(--done);color:#fff}
.vbtns button.on.n{background:var(--late);border-color:var(--late);color:#fff}

/* ---------- vendors ---------- */
.vend{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.vend .top{display:flex;gap:8px;align-items:flex-start}
.vend .top h3{flex:1}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quote{border:1px dashed var(--line-2);border-radius:8px;padding:6px 8px;font-size:12.5px;text-align:center;color:var(--ink-3)}
.quote b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.quote.has{border-style:solid;background:var(--surface-2)}
.quote.low{border-color:var(--done)} .quote.low b{color:var(--done)}
.quote.chosen{background:var(--done-bg);border-color:var(--done)}
.contact-l{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- activity ---------- */
.feed-day{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:16px 4px 6px}
.feed{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed:last-child{border-bottom:0}
.feed .tx{flex:1;font-size:14px}
.feed .tm{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.38);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:51;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
@media (max-width:899px){ .drawer{inset-inline:0;bottom:0;max-height:94vh;height:94vh;border-radius:20px 20px 0 0;transform:translateY(105%)} .drawer.on{transform:none} .drawer::before{content:"";width:40px;height:5px;border-radius:9px;background:var(--line-2);position:absolute;top:7px;left:50%;margin-left:-20px} }
@media (min-width:900px){ .drawer{top:0;bottom:0;inset-inline-end:0;width:540px;transform:translateX(-105%)} .drawer.on{transform:none} }
.dr-h{display:flex;align-items:center;gap:8px;padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.dr-h .ttl{flex:1;font-size:13px;color:var(--ink-3);font-weight:500}
.dr-b>*{flex-shrink:0}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.dr-f{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.title-inp{field-sizing:content;min-height:1.5em;border:0;background:transparent;font-size:21px;font-weight:700;padding:4px 0;width:100%;font-family:var(--font);resize:none;line-height:1.35}
.title-inp:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stgrid button{height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.stgrid button.on{background:var(--sb);border-color:var(--sc);color:var(--sc);font-weight:700}
.sec{border-top:1px solid var(--line);padding-top:14px}
.sec>h3{font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:10px}
details.sec>summary{font-size:13px;color:var(--ink-3);font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.sec>summary::before{content:"‹";transition:transform .2s;display:inline-block}
details.sec[open]>summary::before{transform:rotate(-90deg)}
details.sec>summary+*{margin-top:12px}
.active-dates{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:14px;flex-wrap:wrap}
.active-dates b{font-variant-numeric:tabular-nums}
.deps{display:flex;flex-direction:column;gap:6px}
.dep{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;cursor:pointer}
.dep .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmts{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:8px}
.cmt .bb{flex:1;background:var(--sunk);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.cmt .bb .w{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.cmt-in{display:flex;gap:8px;align-items:flex-end}
.cmt-in textarea{min-height:42px;height:42px}
.saved{font-size:12px;color:var(--done);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* popover / toast / modal */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:170px;display:none}
.pop.on{display:block}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:9px 10px;border:0;background:none;border-radius:8px;font-size:14px;text-align:start}
.pop button:hover{background:var(--sunk)}
.pop button i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.toast{position:fixed;z-index:70;left:50%;transform:translate(-50%,20px);bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;align-items:center;gap:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow-lg);max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent-2);font-weight:700;padding:4px 6px}
@media (prefers-color-scheme: dark){ .toast button{color:var(--accent)} }
@media (min-width:900px){ .toast{bottom:28px} }
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,15,10,.45)}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h2{font-size:20px;margin-bottom:8px;font-family:var(--serif)}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.who button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:600}
.who button:hover{border-color:var(--accent);background:var(--accent-soft)}
.who .av{width:46px;height:46px;font-size:18px}
pre.sum{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:14px;font-family:var(--font);font-size:14px;line-height:1.6;max-height:50vh;overflow:auto;margin:12px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.login .box{max-width:400px}
.login h1{font-size:34px;margin:16px 0 8px}
.more{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.more a{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;box-shadow:var(--shadow);font-weight:600}
.more a svg.i{width:26px;height:26px;color:var(--accent)}
.more a span{font-size:12.5px;color:var(--ink-3);font-weight:400}
.set-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .l{flex:1;min-width:200px}
.set-row .l b{display:block;font-size:14.5px}
.set-row .l span{font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
@media print{ .topbar,.tabbar,.sidenav,.fab{display:none!important} main{padding:0} .card{box-shadow:none} }
</style>

      const p = people().find(p=>p.email && p.email.toLowerCase()===String(user.email).toLowerCase());

      const p2 = people().find(p=>p.email && p.email.toLowerCase()===String(user.email).toLowerCase()) || p;

  },

  ref(col,id){ return this.F.doc(this.db,'homes',PROJECT_ID,col,id); },

    const F=this.F; let first = COLS.length+1, done=false;

      const onErr = e => { console.error(e); if(e.code==='permission-denied'){ this.denied=true; renderDenied(); } else toast('שגיאת סנכרון: '+e.code); if(!done){ done=true; resolve(); } };

      }, onErr);

  // optimistic: update local state immediately; Firestore queues the write (works offline too)
  fire(p){ p.catch(e=>{ console.error(e); toast(e.code==='permission-denied' ? 'אין הרשאה לשמור — בדקו שהמייל שלכם מורשה' : 'השמירה נכשלה: '+(e.code||'')); }); },
  async put(col, doc){ S[col][doc.id]=clone(doc); this.fire(this.F.setDoc(this.ref(col,doc.id), doc)); },
  async patch(col, id, f){ if(S[col][id]) for(const k in f) setPath(S[col][id], k, f[k]); this.fire(this.F.updateDoc(this.ref(col,id), f)); },
  async del(col, id){ delete S[col][id]; this.fire(this.F.deleteDoc(this.ref(col,id))); },
  async addComment(col,id,c){ const d=S[col][id]; if(d) (d.comments ||= []).push(c); this.fire(this.F.updateDoc(this.ref(col,id), {comments: this.F.arrayUnion(c)})); },
  async setSettings(f){ for(const k in f) setPath(S.settings, k, f[k]); this.fire(this.F.setDoc(this.setRef(), unflatten(f), {merge:true})); },
  async bulk(ops){
    for(let i=0;i<ops.length;i+=400){
      const b = this.F.writeBatch(this.db);
      ops.slice(i,i+400).forEach(o=>{
        if(o.op==='put') b.set(this.ref(o.col,o.doc.id), o.doc);
        else if(o.op==='del') b.delete(this.ref(o.col,o.id));
        else if(o.op==='settings') b.set(this.setRef(), o.data, {merge:true});

};

function bindBoardDnD(){
  if(route!=='board') return;
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', el.dataset.drag); el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
  });
  document.querySelectorAll('[data-drop]').forEach(col=>{
    col.addEventListener('dragover', e=>{ if(col.dataset.drop==='באיחור') return; e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('over'));
    col.addEventListener('drop', e=>{ e.preventDefault(); col.classList.remove('over'); const id=e.dataTransfer.getData('text/plain'); if(id) setTaskStatus(id, col.dataset.drop); });
  });
}

function vTimeline(){
  const PX = prefs.gZoom || 4, W = PX*7;
  let ts = visTasks().filter(t=> tStart(t)||tDue(t));
  if(prefs.gHideDone) ts = ts.filter(t=>!isClosed(t));
  if(prefs.gPhase) ts = ts.filter(t=>t.phase===prefs.gPhase);
  const dates = ts.flatMap(t=>[tStart(t),tDue(t)]).concat(msSorted().map(msDate)).filter(Boolean).concat([today(), keyActive()]);
  const minD = dates.reduce((a,b)=>a<b?a:b), maxD = dates.reduce((a,b)=>a>b?a:b);
  const d0n = dn(minD) - ((new Date(dn(minD)*864e5).getUTCDay())) - 7; // sunday before
  const d1n = dn(maxD) + 21;
  const width = (d1n - d0n) * PX;
  const x = iso => (dn(iso)-d0n)*PX;
  // scale
  let months='', weeks='';
  for(let n=d0n; n<=d1n; n++){ const iso=fromDn(n); const [y,m,d]=iso.split('-'); if(d==='01') months += `<div class="g-month" style="inset-inline-start:${(n-d0n)*PX}px">${HEB_MONTHS_FULL[+m-1]} ${y.slice(2)}</div>`; }
  for(let n=d0n; n<=d1n; n+=7){ const iso=fromDn(n); weeks += `<div class="g-week" style="inset-inline-start:${(n-d0n)*PX + W/2}px">${+iso.slice(8)}</div>`; }
  const groups = {}; ts.forEach(t=> (groups[t.phase||'ללא שלב'] ||= []).push(t));
  const order = phases().concat(Object.keys(groups).filter(g=>!phases().includes(g))).filter(g=>groups[g]);
  const row = t => { const s=tStart(t)||tDue(t), e=tDue(t)||s; const st=effStatus(t); const w=Math.max(PX,(dn(e)-dn(s)+1)*PX);
    return `<div class="g-row"><div class="g-label" data-a="openTask" data-id="${esc(t.id)}" title="${esc(t.task)}"><span class="prio ${PRIO_CLS[t.prio]||'p3'}"></span><span class="x">${esc(t.task)}</span><span class="id">${esc(t.id)}</span></div><div class="g-track wk" style="width:${width}px;--wpx:${W}px;background-position-x:right ${-((0)%W)}px"><div class="g-bar s-${ST[st]}" style="inset-inline-start:${x(s)}px;width:${w}px" data-a="openTask" data-id="${esc(t.id)}" title="${esc(t.task)} · ${fmt(s)}–${fmt(e)} · ${esc(st)}"><i style="width:${progress(t)*100}%"></i></div></div></div>`; };
  const msRowG = `<div class="g-row g-ph"><div class="g-label">🏁 אבני דרך</div><div class="g-track" style="width:${width}px">${msSorted().map(m=>{ const d=msDate(m); return d?`<span class="g-dia ${m.id==='M6'?'key':''} ${d<today()?'past':''}" style="inset-inline-start:${x(d)}px" title="${esc(m.id)} · ${esc(m.name)} · ${fmtY(d)}" data-a="openMilestone" data-id="${esc(m.id)}"></span>`:''; }).join('')}</div></div>`;
  pendingAfter.push(()=>{ const w=$('.gwrap'); const tl=$('.g-line.today'); if(w && tl && !w.dataset.scrolled){ w.dataset.scrolled=1; const wr=w.getBoundingClientRect(), lr=tl.getBoundingClientRect(); w.scrollLeft += (lr.left - wr.left) - wr.width*0.65; } });
  return `
  <div class="page-head"><h1>ציר זמן</h1><p>גאנט שבועי לפי התרחיש הפעיל. קו כחול = היום, קו כתום = מפתח, ◆ = אבן דרך. לחיצה על פס פותחת את המשימה.</p></div>
  <div class="toolbar">
    ${scenarioCtl()}
    <select class="inp" data-pref="gPhase" aria-label="שלב"><option value="">כל השלבים</option>${phases().map(p=>`<option ${prefs.gPhase===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <button class="chip ${prefs.gHideDone?'on':''}" data-a="gHideDone">${prefs.gHideDone?'✓ ':''}הסתר סגורות</button>
    <div class="seg" aria-label="זום"><button class="${PX===3?'on':''}" data-a="gZoom" data-v="3">רחוק</button><button class="${PX===4?'on':''}" data-a="gZoom" data-v="4">רגיל</button><button class="${PX===7?'on':''}" data-a="gZoom" data-v="7">קרוב</button></div>
  </div>
  <div class="gwrap" data-keepscroll="gantt">
    <div class="gantt" style="width:calc(var(--lw) + ${width}px)">
      <div class="g-head"><div class="g-corner">משימה</div><div class="g-scale" style="width:${width}px">${months}${weeks}</div></div>
      <div style="position:relative">
        ${msRowG}
        ${order.map(g=>`<div class="g-row g-ph"><div class="g-label">${esc(g)}</div><div class="g-track" style="width:${width}px"></div></div>${groups[g].map(row).join('')}`).join('')}
        <div class="g-line today" style="inset-inline-start:calc(var(--lw) + ${x(today())}px)"><span>היום</span></div>
        <div class="g-line key" style="inset-inline-start:calc(var(--lw) + ${x(keyActive())}px)"><span>🔑 מפתח</span></div>
      </div>
    </div>
  </div>
  <section class="card" style="margin-top:16px">
    <div class="card-h"><h2>🏁 כל אבני הדרך</h2><span class="xs faint">לחיצה לעריכה</span></div>
    <div class="grid g2" style="gap:0 24px">${msSorted().map(msRow).join('')}</div>
  </section>`;
}

function budgetSummary(){
  const items = Object.values(S.items).filter(i=>i.status!=='בוטל');
  const itemsCommitted = items.filter(i=>ITEM_COMMITTED.includes(i.status)).reduce((a,i)=>a+(Number(i.price)||0)*(Number(i.qty)||1),0);
  const itemsPlanned = items.filter(i=>!ITEM_COMMITTED.includes(i.status)).reduce((a,i)=>a+(Number(i.price)||0)*(Number(i.qty)||1),0);
  const vendors = Object.values(S.contacts).filter(c=>c.status==='נבחר').reduce((a,c)=>{ const q = c.chosen ? c['q'+c.chosen] : lowQuote(c); return a + (Number(q)||0); },0);
  const total = Number(S.settings.totalBudget)||0;
  return {total, committed: itemsCommitted + vendors, itemsCommitted, vendors, planned: itemsPlanned};
}
function budgetBlock(b){
  if(!b.total) return `<p class="muted small" style="margin:0 0 10px">התקציב הכולל עוד לא הוגדר (משימה T-001). אחרי ההחלטה — הזינו אותו בהגדרות ותראו כאן כמה כבר התחייבתם.</p><div class="small">מחויב עד כה: <b>${money(b.committed)}</b> · בתכנון: ${money(b.planned)}</div><div style="margin-top:10px"><a class="btn sm" href="#/settings">הגדרת תקציב</a></div>`;
  const c = Math.min(1,b.committed/b.total), p = Math.min(1-c, b.planned/b.total);
  return `<div class="budget"><div><div class="xs faint">מחויב מתוך ${money(b.total)}</div><div class="big">${money(b.committed)}</div></div>
    <div class="bbar" title="מחויב / בתכנון"><i style="width:${c*100}%;background:var(--accent)"></i><i style="width:${p*100}%;background:var(--accent-soft)"></i></div></div>
    <div class="legend" style="margin-top:8px"><span style="--sc:var(--accent)">ספקים שנבחרו ${money(b.vendors)}</span><span style="--sc:var(--accent)">פריטים מאושרים ${money(b.itemsCommitted)}</span><span style="--sc:var(--accent-soft)">בתכנון ${money(b.planned)}</span><span style="--sc:var(--sunk)">יתרה ${money(b.total-b.committed)}</span></div>`;
}

function vActivity(){

/* ============================ drawers ============================ */
let drawer = null; // {col,id}
function openDrawer(html, col, id){
  drawer = {col,id};
  const d = $('#drawer'); d.innerHTML = html; d.classList.add('on'); $('#scrim').classList.add('on');
  document.body.style.overflow='hidden';
  d.dataset.col = col; d.dataset.id = id;
  setTimeout(()=>{ const f=d.querySelector('[data-autofocus]'); if(f){ f.focus(); if(f.select) f.select(); } }, 260);
}
function closeDrawer(){
  if(!drawer) return;
  const d=$('#drawer'); d.classList.remove('on'); $('#scrim').classList.remove('on'); document.body.style.overflow='';
  drawer=null;
  if(/^#\/[^/]+\/.+/.test(location.hash)) history.replaceState(null,'',`#/${route}`);
}
function refreshDrawer(col){
  if(!drawer || (col && col!==drawer.col)) return;
  const doc = S[drawer.col]?.[drawer.id]; if(!doc) return;
  const c = $('#cmts'); if(c) c.innerHTML = commentsHtml(doc);
}
function commentsHtml(doc){
  const cs = (doc.comments||[]).slice().sort((a,b)=>a.ts-b.ts);
  return cs.length ? cs.map(c=>{ const p=person(c.who)||{id:c.who||'x',name:c.whoName||'?'}; return `<div class="cmt">${avatar(p)}<div class="bb"><div class="w">${esc(c.whoName||p.name)} · ${timeAgo(c.ts)}</div>${esc(c.text)}</div></div>`; }).join('') : '<div class="xs faint">אין עדיין הערות. כתבו שאלה לרינת או לאדריכלית…</div>';
}
const commentBox = (col,id) => `<section class="sec"><h3>💬 שיחה</h3><div class="cmts" id="cmts">${commentsHtml(S[col][id]||{})}</div>
  <div class="cmt-in" style="margin-top:10px"><textarea class="inp" id="cmtText" placeholder="כתיבת הערה…" rows="1"></textarea><button class="btn pri icon" data-a="addComment" aria-label="שליחה">${ic('send')}</button></div></section>`;
const drHead = (label, extra='') => `<div class="dr-h"><span class="ttl" id="drTitle">${label}</span>${extra}<span class="saved" id="saved">✓ נשמר</span><button class="btn ghost icon" data-a="closeDrawer" aria-label="סגירה">${ic('x')}</button></div>`;
function flashSaved(){ const s=$('#saved'); if(s){ s.classList.add('on'); clearTimeout(flashSaved.t); flashSaved.t=setTimeout(()=>s.classList.remove('on'),1400); } }

/* ============================ popover / toast / modal ============================ */
function showPop(anchor, html){
  const p=$('#pop'); p.innerHTML=html; p.classList.add('on');
  const r=anchor.getBoundingClientRect(); const pw=p.offsetWidth, ph=p.offsetHeight;
  let top = r.bottom+6; if(top+ph > innerHeight-10) top = Math.max(10, r.top-ph-6);
  let left = r.right - pw; if(left<10) left = Math.min(r.left, innerWidth-pw-10);
  p.style.top=top+'px'; p.style.left=Math.max(10,left)+'px';
}
const hidePop = () => $('#pop').classList.remove('on');
function toast(msg, undo){
  const t=$('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button data-a="undo">ביטול</button>':''}`;
  toast.undo = undo; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'), undo?5000:2600);
}
function modal(html){ $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
const closeModal = () => $('#modal').classList.remove('on');

/* weekly summary */
function weeklyText(){
  const td=today(), wk=addDays(td,-7), nx=addDays(td,7);
  const ts=visTasks();
  const closedIds = new Set(Object.values(S.activity).filter(a=>a.ts>=Date.now()-7*864e5 && a.ref?.col==='tasks' && /הושלם/.test(a.text)).map(a=>a.ref.id));
  const closed = ts.filter(t=>t.status==='הושלם' && (closedIds.has(t.id) || (t.updatedAt && t.updatedAt>=Date.now()-7*864e5)));
  const late = ts.filter(t=>effStatus(t)==='באיחור');
  const decs = decisionsSorted().filter(d=>decStatus(d)!=='הושלם').filter(d=>{ const t=S.tasks[d.taskId]; return t && tDue(t)<=addDays(td,21); });
  const next = ts.filter(t=>!isClosed(t) && effStatus(t)!=='באיחור' && (tStart(t)||tDue(t))<=nx).sort((a,b)=>(tDue(a)||'').localeCompare(tDue(b)||''));
  const stuck = ts.filter(t=>['תקוע','ממתין'].includes(t.status));
  const L = (arr, f) => arr.length ? arr.map(f).join('\n') : '• —';
  return `🏡 *בית אלון — סיכום לישיבה* (${fmtY(td)})
🔑 מפתח: ${fmtY(keyActive())} (${relDays(dn(keyActive())-dn(td))}) · תרחיש ${scenario()}

✅ *נסגר בשבוע האחרון*
${L(closed, t=>`• ${t.task}`)}

⏰ *באיחור*
${L(late, t=>`• ${t.task} — ${t.owner} (יעד ${fmt(tDue(t))})`)}

⛔ *תקוע / ממתין*
${L(stuck, t=>`• ${t.task} — ${t.owner}`)}

⚖️ *החלטות שנדרשות*
${L(decs, d=>`• #${d.no} ${d.title} (יעד ${fmt(tDue(S.tasks[d.taskId]))})`)}

📅 *השבוע הקרוב*
${L(next, t=>`• ${t.task} — ${t.owner} (${fmt(tDue(t))})`)}
`;
}

function loadScript(src){ return new Promise((res,rej)=>{ if(window.XLSX) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
const XLSX_SRC = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
async function exportXlsx(){
  try { await loadScript(XLSX_SRC); } catch { toast('לא ניתן לטעון את רכיב האקסל'); return; }
  const X = window.XLSX, wb = X.utils.book_new();
  const add = (name, rows) => { const ws = X.utils.json_to_sheet(rows); ws['!cols'] = Object.keys(rows[0]||{}).map(k=>({wch: Math.min(50, Math.max(8, k.length+2, ...rows.map(r=>String(r[k]??'').length)))})); X.utils.book_append_sheet(wb, ws, name); };
  add('משימות', allTasks().map(t=>({'ID':t.id,'שלב':t.phase,'משימה':t.task,'אחראי':t.owner,'עדיפות':t.prio,'סטטוס':t.status,'מצב מחושב':effStatus(t),'התקדמות %':Math.round(progress(t)*100),'התחלה (פעיל)':tStart(t),'יעד (פעיל)':tDue(t),'תלויות':t.deps,'Mode':t.mode,'התחלה (מוקדם)':t.sA,'יעד (מוקדם)':t.dA,'התחלה (מאוחר)':t.sB,'יעד (מאוחר)':t.dB,'תיאור':t.desc,'מידע/מסמכים נדרשים':t.docs,'הערות':t.notes})));
  add('אבני דרך', msSorted().map(m=>({'#':m.id,'אבן דרך':m.name,'מוקדם':m.early,'מאוחר':m.late,'תאריך פעיל':msDate(m),'תנאי':m.cond,'הערות':m.notes})));
  add('החלטות', decisionsSorted().map(d=>({'#':d.no,'החלטה':d.title,'למה עכשיו':d.why,'תלות':d.dep,'משימה':d.taskId,'מצב':decStatus(d),'מה הוחלט':d.outcome,'תאריך החלטה':d.decidedAt,'הערות':d.notes})));
  add('ספקים והצעות', Object.values(S.contacts).sort((a,b)=>(a.ord??99)-(b.ord??99)).map(c=>({'תחום':c.domain,'שם':c.name,'חברה':c.company,'טלפון':c.phone,'אימייל':c.email,'הצעה 1':c.q1,'הצעה 2':c.q2,'הצעה 3':c.q3,'נבחרה':c.chosen,'סטטוס':c.status,'משימה':c.taskId,'הערות':c.notes})));
  add('עיצוב ורכש', Object.values(S.items).map(i=>({'פריט':i.name,'חדר':i.room,'קטגוריה':i.cat,'מצב':i.status,'מחיר':i.price,'כמות':i.qty,'סה״כ':(Number(i.price)||0)*(Number(i.qty)||1),'ספק':i.vendor,'קישור':i.link,...Object.fromEntries(people().map(p=>[p.name,(i.approvals||{})[p.id]==='yes'?'👍':(i.approvals||{})[p.id]==='no'?'👎':''])),'הערות':i.notes})));
  wb.Workbook = {Views:[{RTL:true}]};
  X.writeFile(wb, `בית_אלון_${today()}.xlsx`);
}
function exportJson(){
  const o = {exportedAt:new Date().toISOString(), settings:S.settings}; COLS.forEach(c=>o[c]=S[c]);
  const blob = new Blob([JSON.stringify(o,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`בית_אלון_גיבוי_${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importJson(file){
  let o; try { o = JSON.parse(await file.text()); } catch { toast('הקובץ אינו גיבוי תקין'); return; }
  if(!o.tasks){ toast('הקובץ אינו גיבוי תקין'); return; }
  if(!confirm('השחזור יחליף את כל הנתונים הנוכחיים בנתוני הגיבוי. להמשיך?')) return;
  const ops=[]; COLS.forEach(c=>{ Object.keys(S[c]).forEach(id=>{ if(!(o[c]||{})[id]) ops.push({op:'del',col:c,id}); }); Object.values(o[c]||{}).forEach(d=>ops.push({op:'put',col:c,doc:d})); });
  if(o.settings) ops.push({op:'settings',data:o.settings});
  await write(()=> backend.bulk(ops)); await log('שחזר/ה נתונים מגיבוי'); toast('הנתונים שוחזרו');
}
async function importXlsx(file){
  try { await loadScript(XLSX_SRC); } catch { toast('לא ניתן לטעון את רכיב האקסל'); return; }
  const X = window.XLSX; const wb = X.read(await file.arrayBuffer(), {cellDates:true});
  const ws = wb.Sheets['משימות']; if(!ws){ toast('לא נמצאה לשונית "משימות"'); return; }
  const rows = X.utils.sheet_to_json(ws, {header:1, raw:true});
  const hi = rows.findIndex(r=>r && r[0]==='ID'); if(hi<0){ toast('לא נמצאה שורת כותרת עם ID'); return; }
  const d = v => v instanceof Date ? `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}` : (typeof v==='string' && /^\d{4}-\d\d-\d\d/.test(v) ? v.slice(0,10) : '');
  const s = v => v==null ? '' : String(v);
  const ops=[]; let nNew=0, nUpd=0;
  rows.slice(hi+1).forEach(r=>{ const id=s(r[0]).trim(); if(!/^T-\d+/.test(id)) return;
    const cur = S.tasks[id]; const t = Object.assign({}, cur||{}, {id, phase:s(r[1]), task:s(r[2]), owner:s(r[3]), prio:s(r[4])||'בינונית', status:SETTABLE.includes(s(r[5]))?s(r[5]):'לא התחיל', pm: (r[7]===''||r[7]==null)?null:(Number(r[7])<=1?Math.round(Number(r[7])*100):Number(r[7])), deps:s(r[12]).replace('—',''), mode:s(r[13])||'F', sA:d(r[14]), dA:d(r[15]), sB:d(r[16]), dB:d(r[17]), desc:s(r[18]), docs:s(r[19]), notes:s(r[20])});
    cur ? nUpd++ : nNew++; ops.push({op:'put',col:'tasks',doc:t}); });
  if(!ops.length){ toast('לא נמצאו משימות בקובץ'); return; }
  if(!confirm(`נמצאו ${ops.length} משימות: ${nUpd} יעודכנו ו-${nNew} יתווספו. הערות שנכתבו באפליקציה יישמרו. להמשיך?`)) return;
  await write(()=> backend.bulk(ops)); await log(`עדכן/ה ${ops.length} משימות מקובץ אקסל`); toast('המשימות עודכנו מהאקסל');
}

  addComment: () => { const ta=$('#cmtText'); const text=ta.value.trim(); if(!text||!drawer) return; const {col,id}=drawer; const doc=S[col][id];
    const c = {ts:Date.now(), who:prefs.me||'', whoName:myName(), text}; ta.value='';
    write(async()=>{ await backend.addComment(col,id,c); await log(`הגיב/ה על "${doc.task||doc.name||doc.title||doc.domain}": ${trunc(text,60)}`, {col,id}); }).then(()=>refreshDrawer()); },
  delete: () => { if(!drawer) return; const {col,id}=drawer; const doc=clone(S[col][id]); const nm = doc.task||doc.name||doc.title||doc.domain;
    if(!confirm(`למחוק את "${nm}"?`)) return; closeDrawer();
    write(async()=>{ await backend.del(col,id); await log(`מחק/ה את "${nm}"`); }); toast('נמחק', ()=> write(()=>backend.put(col,doc))); },
  markDecided: () => { const id=drawer.id, d=S.decisions[id]; const t=S.tasks[d.taskId];
    write(async()=>{ await backend.patch('decisions',id,{decidedAt:today(), decidedBy:prefs.me||''}); await log(`תיעד/ה החלטה: "${d.title}"${d.outcome?' — '+trunc(d.outcome,60):''}`, {col:'decisions',id}); if(t && !isClosed(t) && confirm(`לסמן גם את המשימה "${t.task}" כהושלמה?`)) await backend.patch('tasks',t.id,Object.assign({status:'הושלם'},stamp())); }).then(()=>decisionDrawer(id)); },
  newTask: () => { const id=nextTaskId(); const td=today(); const f=prefs.taskFilter;
    const t = {id, phase: f.phase || (route==='tasks'?'':'0 איסוף מידע') || '0 איסוף מידע', task:'משימה חדשה', owner: me()?.name || '', prio:'בינונית', status:'לא התחיל', deps:'', mode:'F', sA:td, dA:addDays(td,7), sB:td, dB:addDays(td,7), desc:'', docs:'', notes:'', pm:null, createdAt:Date.now(), createdBy:prefs.me||''};
    if(!t.phase) t.phase='0 איסוף מידע';
    write(async()=>{ await backend.put('tasks',t); await log('הוסיף/ה משימה חדשה', {col:'tasks',id}); }).then(()=>{ S.tasks[id] && (S.tasks[id]._new=true); taskDrawer(id); }); },
  newItem: () => { const id=uid('I'); const i={id,name:'פריט חדש',room:prefs.shopRoom||'סלון',cat:'ריהוט',status:'רעיון',price:null,qty:1,link:'',img:'',vendor:'',taskId:'',notes:'',approvals:{},createdAt:Date.now(),createdBy:prefs.me||''};
    write(async()=>{ await backend.put('items',i); await log('הוסיף/ה פריט לעיצוב ורכש', {col:'items',id}); }).then(()=>{ S.items[id] && (S.items[id]._new=true); itemDrawer(id); }); },
  newContact: () => { const id=uid('C'); const c={id,domain:'תחום חדש',name:'',company:'',phone:'',email:'',q1:null,q2:null,q3:null,chosen:null,status:'לא התחיל',taskId:'',notes:'',ord:999};
    write(()=>backend.put('contacts',c)).then(()=>{ S.contacts[id] && (S.contacts[id]._new=true); contactDrawer(id); }); },
  newDecision: () => { const id=uid('D'); const n = decisionsSorted().filter(d=>/^\d+$/.test(d.no)).length+1; const d={id,no:String(n),title:'החלטה חדשה',why:'',dep:'',taskId:'',related:'',notes:'',outcome:'',decidedAt:'',decidedBy:'',ord:50+n};
    write(()=>backend.put('decisions',d)).then(()=>{ S.decisions[id] && (S.decisions[id]._new=true); decisionDrawer(id); }); },
  setScenario: el => { const v=el.dataset.v; if(scenario()===v) return; write(async()=>{ await backend.setSettings({scenario:v}); await log(`החליף/ה לתרחיש ${v}`); }); toast(`תרחיש ${v} פעיל — כל התאריכים עודכנו`); },
  homeMine: el => { prefs.homeMine = el.dataset.v==='1'; savePrefs(); render(); },
  filterStatus: (el,e) => { e.preventDefault(); prefs.taskFilter = Object.assign(prefs.taskFilter,{status:el.dataset.v, hideDone:false, phase:'', owner:'', prio:'', q:''}); savePrefs(); location.hash='#/tasks'; },
  filterPhase: (el,e) => { e.preventDefault(); prefs.taskFilter = Object.assign(prefs.taskFilter,{phase:el.dataset.v, status:'', group:'phase'}); savePrefs(); location.hash='#/tasks'; },
  toggleHideDone: () => { prefs.taskFilter.hideDone=!prefs.taskFilter.hideDone; savePrefs(); render(); },
  taskGroup: el => { prefs.taskFilter.group=el.dataset.v; savePrefs(); render(); },
  clearFilters: () => { Object.assign(prefs.taskFilter,{q:'',owner:'',phase:'',status:'',prio:''}); savePrefs(); render(); },
  boardOwner: el => { prefs.boardOwner=el.dataset.v; savePrefs(); render(); },
  gHideDone: () => { prefs.gHideDone=!prefs.gHideDone; savePrefs(); render(); },
  gZoom: el => { prefs.gZoom=+el.dataset.v; savePrefs(); const w=$('.gwrap'); if(w) delete w.dataset.scrolled; document.querySelector('[data-keepscroll="gantt"]')?.removeAttribute('data-keepscroll'); render(); },
  shopRoom: el => { prefs.shopRoom=el.dataset.v; savePrefs(); render(); },
  shopStatus: el => { prefs.shopStatus=el.dataset.v; savePrefs(); render(); },
  toggleOther: () => { prefs.showOther=!prefs.showOther; savePrefs(); render(); },
  pickMe: () => pickMeModal(false),
  setMe: el => { prefs.me=el.dataset.v; savePrefs(); closeModal(); render(); toast(`שלום ${me().name} 👋`); },
  closeModal: () => closeModal(),
  weekly: () => { const txt=weeklyText(); modal(`<h2>סיכום לישיבה השבועית</h2><pre class="sum" id="sumTxt">${esc(txt)}</pre><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-a="copySum">${ic('clip','sm')} העתקה</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">שליחה בוואטסאפ</a><span style="flex:1"></span><button class="btn ghost" data-a="closeModal">סגירה</button></div>`); },
  copySum: () => { navigator.clipboard?.writeText($('#sumTxt').textContent).then(()=>toast('הועתק ✓'), ()=>toast('ההעתקה נכשלה')); },
  shareTask: el => { const t=S.tasks[el.dataset.id]; const url = location.href.split('#')[0] + `#/tasks/task:${t.id}`; const text=`${t.task} (${t.id})`;
    if(navigator.share) navigator.share({title:'בית אלון', text, url}).catch(()=>{}); else navigator.clipboard?.writeText(url).then(()=>toast('הקישור הועתק')); },
  undo: () => { const u=toast.undo; $('#toast').classList.remove('on'); toast.undo=null; if(u) u(); },
  exportXlsx: () => exportXlsx(),
  exportJson: () => exportJson(),
  print: () => print(),
  resetLocal: () => { if(!confirm('לאפס את כל הנתונים המקומיים ולחזור לנתוני האקסל המקוריים? (מומלץ לגבות קודם)')) return; seedInto(S); LocalBackend.persist(); render(); toast('אופס לנתוני הפתיחה'); },
  signOut: () => backend.signOut(),
  login: () => FirebaseBackend.login()
};
document.addEventListener('click', e=>{
  if(e.target.closest('[data-stop]')) return;
  const el = e.target.closest('[data-a]');
  if(!$('#pop').contains(e.target) && !(el && el.dataset.a==='statusMenu')) hidePop();
  if(el && e.target.closest('#modal') && !e.target.closest('#modalBox') ) { closeModal(); return; }
  if(!el){ if(e.target.id==='modal') closeModal(); return; }
  const fn = A[el.dataset.a]; if(!fn) return;
  if(el.tagName==='A' && !['filterStatus','filterPhase'].includes(el.dataset.a)) e.preventDefault();
  e.stopPropagation();
  fn(el, e);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if($('#pop').classList.contains('on')) hidePop(); else if($('#modal').classList.contains('on')) closeModal(); else closeDrawer(); }
  if(e.key==='Enter' && (e.metaKey||e.ctrlKey) && e.target.id==='cmtText') A.addComment();
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && route==='tasks'){ e.preventDefault(); $('#tq')?.focus(); }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-a]:not(button):not(a)')){ e.preventDefault(); e.target.click(); }
});
// task filter inputs
let qT;
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.tf==='q'){ clearTimeout(qT); qT=setTimeout(()=>{ prefs.taskFilter.q=el.value; savePrefs(); render(); }, 160); }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.tf && el.dataset.tf!=='q'){ prefs.taskFilter[el.dataset.tf]=el.value; savePrefs(); render(); return; }
  if(el.dataset.pref){ prefs[el.dataset.pref]=el.value; savePrefs(); render(); return; }
  if(el.dataset.file){ const f=el.files[0]; if(f) (el.dataset.file==='json'?importJson:importXlsx)(f); el.value=''; return; }
  if(el.dataset.set){ let v = el.value; if('num' in el.dataset) v = numOrNull(v); const k=el.dataset.set;
    write(async()=>{ await backend.setSettings({[k]:v}); if(k==='keyActual') await log(v?`קבע/ה מועד מפתח בפועל: ${fmtY(v)}`:'ביטל/ה את מועד המפתח בפועל'); if(k==='totalBudget') await log(`עדכן/ה תקציב כולל: ${money(v)}`); });
    if(k==='keyActual') toast(v?'כל המשימות הצמודות למפתח הוזזו':'חזרה לתאריכי התרחיש'); return; }
  if(el.dataset.person!=null){ const arr=clone(people()); arr[+el.dataset.person][el.dataset.pf]=el.value.trim(); write(()=>backend.setSettings({people:arr})); return; }
  if(el.dataset.f && drawer){
    const {col,id}=drawer; const doc=S[col][id]; if(!doc) return;
    let v = el.value; if('num' in el.dataset) v = numOrNull(v);
    if(el.dataset.f==='title'||el.dataset.f==='task'||el.dataset.f==='name'||el.dataset.f==='domain'){ v=v.trim(); if(!v) { el.value=doc[el.dataset.f]; return; } }
    if(doc[el.dataset.f]===v) return;
    const f = el.dataset.f;
    write(async()=>{ await backend.patch(col,id,Object.assign({[f]:v}, col==='tasks'||col==='items'?stamp():{})); if(['task','sA','dA','sB','dB','owner','mode'].includes(f) && col==='tasks') await log(`עדכן/ה ${({task:'שם',owner:'אחראי',mode:'סוג תזמון'})[f]||'תאריך'} של "${doc.task}"`, {col,id}); });
    if(['mode','sA','dA','sB','dB','deps'].includes(f)) setTimeout(()=>{ if(drawer&&drawer.id===id){ const sc=$('.dr-b').scrollTop; DRAWERS[col](id); $('.dr-b').scrollTop=sc; } },60);
  }
});
// swipe-down to close bottom sheet
(()=>{ let y0=null; const d=$('#drawer');
  d.addEventListener('touchstart', e=>{ const b=d.querySelector('.dr-b'); if(e.target.closest('.dr-h') || (b && b.scrollTop<=0 && e.target.closest('.dr-b')===null)) y0=e.touches[0].clientY; else y0=null; }, {passive:true});
  d.addEventListener('touchmove', e=>{ if(y0==null) return; const dy=e.touches[0].clientY-y0; if(dy>0) d.style.transform=`translateY(${dy}px)`; }, {passive:true});
  d.addEventListener('touchend', e=>{ if(y0==null) return; const dy=(e.changedTouches[0].clientY-y0); d.style.transform=''; if(dy>110) closeDrawer(); y0=null; });
})();

function onRoute(){
  const arg = parseRoute();
  if(route==='task' && arg){ route='tasks'; }
  render(); $('#view')?.focus({preventScroll:true}); if(!arg) scrollTo(0,0);
  if(arg){ const [kind,id] = arg.split(':'); const map={task:'tasks',item:'items',decision:'decisions',contact:'contacts',milestone:'milestones'}; const col=map[kind]; if(col && S[col]?.[id]) DRAWERS[col](id); }
  else closeDrawer();
}
window.addEventListener('hashchange', onRoute);

/* ============================ login / denied ============================ */
function renderLogin(){
  $('#root').innerHTML = `<div class="login"><div class="box"><span class="brand" style="justify-content:center"><span class="logo" style="width:64px;height:64px;border-radius:18px">${LOGO}</span></span>
  <h1>בית אלון</h1><p class="muted">מרכז ניהול השיפוץ והלבשת הבית — לאריאל, רינת והאדריכלית.</p>
  <button class="btn pri" style="height:50px;padding:0 26px;font-size:16px;margin-top:18px" data-a="login">התחברות עם Google</button>
  <p class="xs faint" style="margin-top:18px">הגישה מוגבלת למיילים מורשים בלבד.</p></div></div>`;
}
function renderDenied(){
  $('#root').innerHTML = `<div class="login"><div class="box"><h1>אין הרשאה 🔒</h1><p class="muted">המייל <span class="ltr">${esc(currentUser?.email||'')}</span> אינו ברשימת המורשים.<br>בקשו מאריאל להוסיף אותו לכללי האבטחה ב-Firebase.</p><button class="btn" data-a="signOut" style="margin-top:14px">התחברות עם חשבון אחר</button></div></div>`;
  closeDrawer();
}

/* ============================ boot ============================ */
(async function boot(){
  if(FIREBASE_CONFIG){
    backend = FirebaseBackend; syncState='cloud';
    $('#root').innerHTML = `<div class="login"><div class="muted">טוען…</div></div>`;
    try { await FirebaseBackend.init(); return; } catch(e){ console.error(e); $('#root').innerHTML = `<div class="login"><div class="box"><h1>שגיאת חיבור</h1><p class="muted">לא הצלחנו להתחבר ל-Firebase. בדקו את ה-config ואת החיבור לרשת.</p><p class="xs faint ltr">${esc(e.message)}</p></div></div>`; return; }
  } else {
    backend = LocalBackend; await LocalBackend.init();
  }
  startApp();
})();
function startApp(){ onRoute(); if(!me()) pickMeModal(true); }
</script>
</body>
